name: Build RadiantOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # можно запускать вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm gcc g++ grub-pc-bin xorriso mtools

    - name: Build ISO
      run: make iso

    - name: Upload ISO
      uses: actions/upload-artifact@v4
      with:
        name: awizz_os-iso
        path: build/awizz_os.iso
